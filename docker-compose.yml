services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - dots-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The dot's single thread of consciousness.
  daemon:
    build:
      context: .
      target: daemon
    restart: unless-stopped
    env_file: .env
    volumes:
      - dots-data:/app/data

volumes:
  dots-data: