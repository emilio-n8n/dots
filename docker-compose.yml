services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - dots-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The daemon. One instance — it is the dot's single thread of consciousness.
  daemon:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "daemon/dotsd.ts"]
    env_file: .env
    volumes:
      - dots-data:/app/data

volumes:
  dots-data: